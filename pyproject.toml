[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishhawk"
version = "0.1.0"
description = "Forensic-grade email security analyzer for SOC analysts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Agent Mackenzie", email = "mackenzie@phishhawk.local"}
]
keywords = ["phishing", "email", "security", "forensics", "soc", "malware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Communications :: Email",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "filetype>=1.2.0",
    "dnspython>=2.4.0",
    "checkdmarc>=5.0.0",
    "tldextract>=5.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
msg = ["extract-msg>=0.50.0"]
all = [
    "extract-msg>=0.50.0",
    "yara-python>=4.5.0",
    "oletools>=0.60.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0",
    "geoip2>=4.8.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
phishhawk = "phishhawk.cli:app"

[project.urls]
Homepage = "https://github.com/raphael/phishhawk"
Repository = "https://github.com/raphael/phishhawk"
Documentation = "https://github.com/raphael/phishhawk#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/phishhawk"]
omit = ["*/tests/*"]
